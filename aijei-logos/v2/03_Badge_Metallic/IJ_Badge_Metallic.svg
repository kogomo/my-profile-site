<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>AIJEI Badge - Metallic</title>
  
  <defs>
    <!-- Outer badge background gradient: dark gunmetal -->
    <linearGradient id="badgeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3A3735"/>
      <stop offset="50%"  stop-color="#1C1A19"/>
      <stop offset="100%" stop-color="#0B0A09"/>
    </linearGradient>
    <!-- Inner highlight ring -->
    <linearGradient id="badgeRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A8A29C" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#5A5552" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A1817" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Wordmark metallic colors (brighter, since on dark bg) -->
    <linearGradient id="badgeMetalCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D8D5D1"/>
      <stop offset="40%"  stop-color="#A8A39E"/>
      <stop offset="50%"  stop-color="#E8E4DF"/>
      <stop offset="62%"  stop-color="#7E7A76"/>
      <stop offset="100%" stop-color="#3D3B3A"/>
    </linearGradient>
    <linearGradient id="badgeMetalRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF5560"/>
      <stop offset="42%"  stop-color="#D6262D"/>
      <stop offset="52%"  stop-color="#FF6670"/>
      <stop offset="64%"  stop-color="#A8131A"/>
      <stop offset="100%" stop-color="#5A0509"/>
    </linearGradient>
    <!-- Soft inner glow for depth -->
    <radialGradient id="innerGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge background: rounded square -->
  <rect x="0" y="0" width="256" height="256" rx="48" ry="48" fill="url(#badgeBg)"/>
  <!-- Rim highlight -->
  <rect x="2" y="2" width="252" height="252" rx="46" ry="46" fill="none" stroke="url(#badgeRim)" stroke-width="1.5"/>
  <!-- Inner top glow for dimension -->
  <rect x="0" y="0" width="256" height="256" rx="48" ry="48" fill="url(#innerGlow)"/>
